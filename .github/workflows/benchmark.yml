name: Benchmark

on:
  workflow_dispatch:        # run manually from Actions tab
  schedule:
    - cron: "0 3 * * 1"    # every Monday at 3am UTC
  push:
    paths:
      - "benchmark/**"     # also run when benchmark code changes

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # TF-IDF, fast; not the shipped engine. This job is a regression guard
      # on the no-dependency code path, NOT a measurement of the product —
      # nothing it prints should be quoted. Publishable figures need
      # `--use-sulci`, which needs the model weights and ~10 minutes.
      - name: Run benchmark (built-in TF-IDF engine, no deps — NOT the shipped engine)
        run: |
          python3 benchmark/run.py --no-sweep
          echo "── Stateless Results (TF-IDF — not the shipped engine) ──"
          cat benchmark/results/tfidf/summary.json

          python3 benchmark/run.py --no-sweep --context
          echo "── Context-Aware Results (TF-IDF — not the shipped engine) ──"
          cat benchmark/results/tfidf/context_summary.json

      - name: Upload results as artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark/results/
          retention-days: 90
