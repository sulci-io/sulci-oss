name: Release gate

# oss-0056 (2026-11-03). publish.yml's test job, run on every pull request, so a PR fails where a release tag would.
#
# v1.3.0's first publish run (41682513304) failed on 3.9 after every PR check was green: tests.yml runs the suites
# file by file and gates some steps off 3.9, while publish.yml runs `pytest tests/ sulci/tests/` whole, with its own
# installs and no PYTEST_ADDOPTS. This workflow is that job: same matrix, same steps, byte for byte.
# tests/test_release_gate.py fails if the steps below drift from publish.yml's test job — change both together.
#
# It lives outside tests.yml on purpose: scripts/check_ci_test_coverage.py reads tests.yml and would count a
# whole-suite command there as covering every suite, so a suite missing from the per-file steps would go unnoticed.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: publish.yml's tests (${{ matrix.python-version }})
    # ubuntu-24.04, not ubuntu-latest (oss-0059): ubuntu-latest became Ubuntu 26.04, where
    # actions/setup-python has no Python 3.9 (sulci-web's checks failed on it 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start
          redis-cli ping

      - name: Install test dependencies
        run: pip install ".[sqlite,redis,langchain,llamaindex]" qdrant-client "pytest<9.2" pytest-cov httpx pytest-asyncio==0.21.1

      # ── the surfaces this release EXISTS to publish ──────────────────────
      # Without this the job still went green: `pytest tests/` collects the
      # three suites, they hit importorskip because the extras are absent, and
      # 77 tests SKIP silently. The release gate would have published
      # sulci-mcp, sulci-proxy and the LiteLLM adapter having executed none of
      # them. Same shape as the 12 green checks over 77 tests that never ran,
      # except at the point of no return.
      #
      # 3.9 is excluded because mcp, litellm and fastapi all declare
      # requires-python >=3.10. Mirrors the gate in tests.yml -- do not invent
      # a second pattern for this.
      - name: Install the v0.9.0 integration surfaces (3.10+)
        if: matrix.python-version != '3.9'
        run: pip install ".[mcp,litellm,proxy]"

      # ── the promise, tested on the floor that makes it ───────────────────
      # pyproject declares requires-python = ">=3.9". `sulci[all]` resolved on
      # 3.9 in 0.8.3 and stopped resolving in 0.9.0 the moment mcp/litellm/
      # fastapi were added to it -- invisible, because no job installs `all`.
      # PEP 508 markers on those four entries fix it; this step is what proves
      # the fix and catches the next one.
      #
      # UNCONDITIONAL on purpose: the 3.9 job is the only one that can fail
      # here, so skipping it there would remove the entire point.
      # --dry-run needs pip >= 22.2. If a runner ever ships older, drop the
      # flag; a real install is slower but tests the same thing.
      - name: "sulci[all] resolves on the declared Python floor"
        run: pip install --dry-run ".[all]"

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}

      - name: Pre-fetch MiniLM (retry through HF 429s)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
          if python - <<'PYEOF'
          import importlib.util, sys
          if importlib.util.find_spec("sentence_transformers") is None:
              sys.exit(0)   # model-less env; tests guard/skip themselves
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("all-MiniLM-L6-v2")
          PYEOF
          then exit 0; fi
          echo "HF fetch attempt $i failed (likely 429); backing off $((i*60))s"
          sleep $((i*60))
          done
          echo "::warning::MiniLM pre-fetch failed after 5 attempts; tests may flake"

      - name: Run tests
        run: pytest tests/ sulci/tests/ -v --tb=short
