name: Tests

on:
  # Post-merge validation. `paths-ignore` is safe on `push` because a push to
  # main is never a required status check on a pull request — nothing can be
  # left pending by a run that does not start.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
  # DELIBERATELY UNFILTERED. This repo HAS a base branch policy — #116 was
  # refused and needed `--admin` — so a `paths-ignore` here could leave a
  # required check pending forever on a docs-only PR.
  #
  # ❌ This comment used to read: "sulci-platform is the opposite case: `gh api
  #    .../branches/main/protection` 403s there, so narrowing its triggers is
  #    free." Corrected 2026-08-12. A PERMISSION ERROR IS NOT A POLICY READING,
  #    and the sentence was wrong twice:
  #      * It named the wrong endpoint. `/branches/main/protection` reads
  #        CLASSIC protection only; on sulci-oss it returns 404 "Branch not
  #        protected" while a ruleset is actively refusing merges. The 403
  #        comes from the RULESETS endpoint, and it says "Upgrade to GitHub
  #        Pro" — a plan limit, not an answer about the branch.
  #      * A 404 and a 403 from these endpoints mean different things and
  #        NEITHER means "unprotected".
  #    The conclusion happened to be right — a direct push to sulci-platform
  #    main succeeded on 2026-08-12 — but it was right by luck. The only test
  #    that settles it is attempting the operation. Check the repo by pushing
  #    to a throwaway branch and opening a PR, not by reading an error code.
  #
  # The saving is taken in the jobs instead. A job skipped by an `if:`
  # condition reports a conclusion, and GitHub treats a skipped required check
  # as satisfied; a workflow filtered out by `paths-ignore` reports nothing at
  # all. Same runner minutes saved, no starved check.
  pull_request:
    branches: [main]

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────
  # Why this exists: the matrix below is 3 OS x 4 Python = 12 jobs, and it ran
  # in full on every documentation-only PR. Measured on #116 — three markdown
  # files — that was roughly 2 hours of runner time. Windows 3.12 alone took
  # 17m17s; the three Windows jobs came to ~38m against ~18m for all four
  # Ubuntu.
  #
  # Only tests.yml has this gap. benchmark.yml already carries a positive
  # `paths: ["benchmark/**"]`, which is stricter, and publish.yml triggers on
  # `tags: ["v*"]`, where paths filters do not apply at all. "None of the three
  # workflows filters" was literally true and misleading.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need both endpoints of the PR range to diff them

      - id: filter
        shell: bash
        run: |
          # Anything that is not a push event and not a pull_request event
          # (workflow_dispatch, a re-run) runs the suite. Fail toward testing.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull_request event — running the suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true

          if ! changed="$(git diff --name-only "$base" "$head" 2>/dev/null)"; then
            echo "could not diff $base..$head — running the suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "── changed files ──"
          printf '%s\n' "$changed"
          echo "───────────────────"

          # DOCS_ONLY is the same list as the push trigger's paths-ignore.
          # Keep them in step: this one gates PRs, that one gates main.
          DOCS_ONLY='(\.md$|^docs/|^LICENSE$|^NOTICE$|^\.gitignore$)'

          if printf '%s\n' "$changed" | grep -qvE "$DOCS_ONLY"; then
            echo "code changed — running the suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the 12-job matrix"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs on BOTH sides of the docs-only gate, deliberately. A code-only PR
      # moves core.py and leaves the doc behind; a docs-only PR edits the doc
      # and the 12-job matrix is skipped entirely, so nothing else would read
      # it. ~1s: two ast.parse calls and a regex over one markdown file.
      - name: CI runs every test suite on disk
        run: python3 scripts/check_ci_test_coverage.py

      - name: API surface matches the docs
        run: python3 scripts/check_api_surface.py

      # Reads the four committed seed-N draws and re-derives the aggregates
      # CLAIMS.md publishes. Runs here beside the other cheap consistency
      # checks rather than in the matrix: four JSON reads, ~0s, and twelve
      # identical passes would prove nothing extra. Runs on docs-only PRs
      # too, deliberately — a CLAIMS.md edit that no longer matches the
      # draws is exactly what this catches. The run modes (--default,
      # --seed N) are pre-release; --agent adds ~13min.
      - name: MiniLM agent draws match the register
        run: python3 scripts/check_agent_draws.py --aggregate-only

  # ── Matrix ────────────────────────────────────────────────────────────
  # NOTE THE ABSENCE OF A JOB-LEVEL `if:`. That was the obvious way to write
  # this and it does not work here. Measured on PR #118, a docs-only probe:
  # with `if: needs.changes.outputs.code == 'true'` on the JOB, GitHub does not
  # expand the matrix before evaluating the condition. It emits ONE check run
  # named `test`, conclusion `skipped` — not twelve named
  # `test (ubuntu-latest, 3.9)` and so on.
  #
  # The ruleset `protect-main` (id 17006725) requires those twelve names
  # individually. A context that never reports is not "skipped and therefore
  # satisfied"; it is permanently Expected, and the PR is blocked forever. The
  # collapsed `test` check does not match any required context either.
  #
  # So the job always runs and every STEP carries the condition instead. A job
  # whose steps all skip still completes `success` under its real matrix name,
  # which is what the ruleset needs. Cost is runner start-up only — no
  # checkout, no pip, no HuggingFace fetch — roughly 15-30s per job against the
  # 3-18 minutes each takes with steps enabled.
  #
  # Consequence worth stating plainly: on a docs-only PR these twelve checks go
  # green having tested nothing. That is not a hole so long as the `changes`
  # gate is honest about what counts as documentation. DOCS_ONLY above is the
  # entire safety argument — widen it carelessly and green stops meaning
  # anything. Its log line says which files it saw and which branch it took.
  test:
    needs: changes
    # When the steps are all skipped there is nothing OS-specific left to do,
    # so a skipped run does not need the OS it names. GitHub derives the check
    # name from the MATRIX values, not from runs-on, so every job still reports
    # as `test (macos-latest, 3.11)` and friends while actually starting a
    # Linux runner.
    #
    # This is purely a billing decision and it is a large one: macOS bills at
    # 10x and Windows at 2x, so twelve runners starting and stopping for
    # nothing costs ~35 billable minutes at their real OS versus ~4 on Linux.
    # Four idle macOS starts alone are ~30 of that 35.
    #
    # Read it as: `code == 'true' ? matrix.os : 'ubuntu-latest'`. GitHub has no
    # ternary, so `&&`/`||` is the idiom — safe here because matrix.os is
    # always a non-empty string and can never be falsy.
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}

    # Measured 2026-08-19: an apt-get failover to archive.ubuntu.com stalled
    # on three ubuntu legs of run 32270792542 and GitHub's 360-minute ceiling
    # was the only thing that stopped them -- 1,080 runner-minutes on one
    # transient mirror fault, and 5dd0f16 was left with no completed run.
    # Successful legs finish in 9-20 minutes. This does not fix apt; it caps
    # it. See #151.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Redis (Linux only)
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start
          redis-cli ping

      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: pip install ".[sqlite,redis,langchain,llamaindex]" qdrant-client pytest pytest-cov httpx pytest-asyncio==0.21.1

      # The v0.9.0 surfaces need Python 3.10+: mcp, litellm and fastapi all
      # declare requires-python >=3.10, while sulci itself is >=3.9. Installed
      # as a SEPARATE step so a resolver failure here cannot be mistaken for a
      # failure of the core install. Measured 2026-08-11.
      - name: Install v0.9.0 integration surfaces (3.10+)
        if: matrix.python-version != '3.9'
        run: pip install ".[mcp,litellm,proxy]"

      - name: Cache HuggingFace models
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}-py${{ matrix.python-version }}

      - name: Pre-fetch MiniLM (retry through HF 429s)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
          if python - <<'PYEOF'
          import importlib.util, sys
          if importlib.util.find_spec("sentence_transformers") is None:
              sys.exit(0)   # model-less env; tests guard/skip themselves
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("all-MiniLM-L6-v2")
          PYEOF
          then exit 0; fi
          echo "HF fetch attempt $i failed (likely 429); backing off $((i*60))s"
          sleep $((i*60))
          done
          echo "::warning::MiniLM pre-fetch failed after 5 attempts; tests may flake"

      - name: Test Qdrant tenant isolation
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_qdrant_tenant_isolation.py -v --tb=short

      - name: Conformance suite
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/compat/ sulci/tests/compat/ -v --tb=short

      - name: Test core
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_core.py -v --tb=short --cov=sulci --cov-report=term-missing

      - name: Test flow contracts
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/integration/flows/ -v --tb=short

      - name: Test context
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_context.py -v --tb=short

      - name: Test sessions
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_sessions.py -v --tb=short

      - name: Test sinks
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_sinks.py -v --tb=short

      - name: Backend tests (skip missing deps)
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_backends.py -v --tb=short

      - name: Test AsyncCache
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_async_cache.py -v --tb=short

      - name: Framework adapters
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_integrations_langchain.py -v --tb=short

      # sulci[llamaindex] requires Python 3.10+ -- llama-index-core pulls banks,
      # which declares requires_python>=3.9 and uses 3.10-only syntax. The test
      # module skips itself on 3.9 (see the module-level skip in that file) and
      # pytest then exits 5 = nothing collected. Excluded here so the exit code
      # is not load-bearing. Measured 2026-08-09.
      - name: Framework adapters (LlamaIndex)
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.9'
        run: pytest tests/test_integrations_llamaindex.py -v --tb=short

      # ── v0.9.0 integration surfaces ──────────────────────────────────────
      # Added 2026-08-11. These suites shipped on 08-11 and this workflow
      # enumerates test files BY NAME, so for one push they ran on zero CI
      # jobs while all 12 checks reported green. Anything added to tests/
      # must be added here too -- nothing detects the omission.
      #
      # 3.9 is excluded for the same reason as LlamaIndex above: mcp,
      # litellm and fastapi are all requires-python >=3.10, so the deps are
      # not installed there and pytest would exit 5 (nothing collected).
      - name: MCP server
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.9'
        run: pytest tests/test_integrations_mcp.py -v --tb=short

      - name: LiteLLM cache adapter
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.9'
        run: pytest tests/test_integrations_litellm.py -v --tb=short

      - name: Caching proxy
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.9'
        run: pytest tests/test_proxy.py -v --tb=short

      # ── the release guard ────────────────────────────────────────────────
      # Covers scripts/check_tag_version.py, which gates publish.yml. It has
      # no runtime dependencies and runs on every matrix leg including 3.9.
      #
      # 📌 Its most important assertion is that CANNOT-READ exits 2 and not 0.
      # A gate that returns green when it cannot read the value it checks is
      # the failure family §0 records four times over.
      - name: Release guard (tag vs pyproject)
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_tag_version.py -v --tb=short

      # ── suites that CI never ran until 2026-08-11 ────────────────────────
      # These eleven were run by `make checkin` and by NO CI job, some for
      # months -- including all four telemetry suites, which guard the wire
      # allowlist, and test_connect (59 tests). Found by the audit that
      # followed the v0.9.0 suites being omitted the same way.
      #
      # scripts/check_ci_test_coverage.py now fails the build if a file in
      # tests/ is not named here, so the next omission is loud instead of
      # silent. Run it before adding a suite.
      - name: Telemetry
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_telemetry.py tests/test_telemetry_gateway_override.py tests/test_telemetry_lifecycle.py -v --tb=short

      - name: Connect and config
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_connect.py tests/test_oss_connect.py tests/test_config.py -v --tb=short

      - name: Cloud backend
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_cloud_backend.py -v --tb=short

      - name: Attribution, nudge, thresholds, session-store injection
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/test_hit_attribution.py tests/test_nudge.py tests/test_per_call_threshold.py tests/test_context_threshold.py tests/test_session_store_injection.py -v --tb=short

  # ── sulci[all] resolution ─────────────────────────────────────────────
  # A SEPARATE JOB, NOT A MATRIX STEP, and deliberately small.
  #
  # pyproject.toml records why this exists, at the `all` extra's PEP 508
  # marker block: `pip install "sulci[all]"` FAILED TO RESOLVE on 3.9 --
  # "it worked in 0.8.3 and broke in 0.9.0, silently, because nothing
  # installs `all` in CI. Measured 2026-08-13." That gap stayed open until
  # 2026-08-20 and it absorbed a second declaration in the meantime: the
  # litellm <1.97.0 cap (#148) is written in TWO places, the `litellm`
  # extra and `all`, and only the first was exercised by anything.
  #
  # Two floors, not twelve. 3.9 is where the four markers do their work --
  # mcp / litellm / fastapi / uvicorn are all requires-python >=3.10 and
  # must be SKIPPED rather than fail the resolve. 3.12 is where they must
  # all install. The ten other matrix cells would tell us nothing either
  # of these two does not.
  #
  # Resolution only. It installs and imports; it does not run the suite.
  # A resolver failure and a test failure are different findings and this
  # job exists to make the first one unambiguous. See #149.
  install-all:
    name: sulci[all] resolves (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - name: pip install ".[all]"
        if: needs.changes.outputs.code == 'true'
        run: pip install ".[all]"

      - name: Import the core package
        if: needs.changes.outputs.code == 'true'
        run: python -c "import sulci; print(sulci.__version__)"

      # On 3.9 the four markered extras must be ABSENT, not merely
      # uninstalled-and-ignored. `sulci[all]` resolving on 3.9 while
      # silently installing litellm would mean the markers had stopped
      # doing their job, and the next 1.97.0-shaped upstream break would
      # reach 3.9 users through an extra they were never meant to get.
      - name: 3.9 skips the 3.10+ surfaces
        if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.9'
        run: |
          for pkg in mcp litellm fastapi uvicorn; do
            if pip show "$pkg" > /dev/null 2>&1; then
              echo "::error::$pkg is installed on 3.9. The PEP 508 markers on the \`all\` extra are not binding."
              exit 1
            fi
            echo "ok: $pkg correctly absent on 3.9"
          done

      # And on 3.12 they must all be present, or `all` is quietly partial.
      - name: 3.12 installs the 3.10+ surfaces
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.9'
        run: |
          for pkg in mcp litellm fastapi uvicorn; do
            pip show "$pkg" > /dev/null 2>&1 || { echo "::error::$pkg missing from sulci[all] on ${{ matrix.python-version }}"; exit 1; }
            echo "ok: $pkg present"
          done
          # #148: the cap lives in the `all` extra as well as the `litellm`
          # extra, and until this job existed only the latter was checked.
          python - <<'PY'
          import litellm, sys
          v = tuple(int(x) for x in litellm.__version__.split(".")[:2])
          print("litellm", litellm.__version__)
          if v >= (1, 97):
              sys.exit("litellm >=1.97.0 resolved from the `all` extra; the cap is not binding there. See #148, BerriAI/litellm#36384.")
          PY
