[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "sulci"
version         = "0.9.1"
description     = "The AI native context-aware semantic cache for LLM apps — Patent Pending - stop paying for the same answer twice"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"
authors         = [
    { name = "Kathiravan Sengodan" },
]
keywords        = [
    "sulci-cache", "ai-native", "ai-cache", "context-aware-semantic-cache",
    "context-aware", "semantic-cache", "llm", "ai", "anthropic", "openai",
    "vector-search", "langchain", "cost-optimization", "cache", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# httpx is mandatory: the SulciCloudBackend transport and the telemetry
# pipe both need it. Promoted from the [cloud] extra in v0.6.3 so that
#   pip install sulci
# alone is sufficient for sulci.connect() telemetry and the managed
# cache (Cache(backend="sulci")). ~150KB, no transitive bloat. Heavier
# embedding stacks (sentence-transformers ~500MB w/ torch) remain in
# per-backend extras — they're only needed for local-embedding backends.
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
chroma   = ["chromadb>=0.4.0",     "sentence-transformers>=2.2.0"]
qdrant   = ["qdrant-client>=1.7.0","sentence-transformers>=2.2.0"]
faiss    = ["faiss-cpu>=1.7.4",    "sentence-transformers>=2.2.0"]
redis    = ["redis>=5.0.0",        "redisvl>=0.1.0", "sentence-transformers>=2.2.0"]
sqlite   = ["sentence-transformers>=2.2.0"]
milvus   = ["pymilvus>=2.3.0",     "sentence-transformers>=2.2.0"]
openai   = ["openai>=1.0.0"]
cloud    = ["httpx>=0.27.0"]  # no-op since v0.6.3 (httpx is now mandatory); kept for back-compat
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
# ⚠ These three extras require PYTHON 3.10+, while sulci itself is >=3.9:
#   mcp      requires-python >=3.10
#   litellm  requires-python >=3.10,<3.15
#            CAPPED <1.97.0: 1.97.0 breaks `Message` forward-ref resolution
#            on 3.10 ONLY -- identical packages (litellm 1.97.0, pydantic
#            2.13.4, same cp310-abi3 wheel) pass on 3.11+. Upstream
#            BerriAI/litellm#36384, open. 1.96.2 passed all 12 matrix legs
#            on e3758f7 (08-14). The cap is in TWO places: the `litellm`
#            extra and `all`. Lift both together.
#   fastapi  requires-python >=3.10
# They are extras precisely so the 3.9 floor holds for everyone else. Same
# situation as llamaindex. Measured 2026-08-11.
#
# mcp 1.x is NOT supported: its FastMCP entry point was removed in 2.0.
mcp      = ["mcp>=2.0.0"]
litellm  = ["litellm>=1.90.0,<1.97.0"]
proxy    = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "httpx>=0.27.0"]
all      = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "faiss-cpu>=1.7.4",
    "redis>=5.0.0",
    "redisvl>=0.1.0",
    "pymilvus>=2.3.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    # ── PEP 508 MARKERS, AND ONLY HERE ───────────────────────────────────────
    # These four declare requires-python >=3.10 while sulci is >=3.9. Without
    # the markers `pip install "sulci[all]"` FAILS TO RESOLVE on 3.9 -- it
    # worked in 0.8.3 and broke in 0.9.0, silently, because nothing installs
    # `all` in CI. Measured 2026-08-13.
    #
    # The markers are on `all` and DELIBERATELY NOT on the individual mcp /
    # litellm / proxy extras. The asymmetry is the point:
    #
    #   sulci[all] on 3.9  -> installs what is installable. Works.
    #   sulci[mcp] on 3.9  -> resolver error naming the Python requirement.
    #
    # A marker on the individual extra would make `pip install "sulci[mcp]"`
    # SUCCEED on 3.9 having installed nothing, and the user would meet an
    # ImportError later with no idea why. A loud failure at install time is
    # the kinder one.
    "mcp>=2.0.0;        python_version >= '3.10'",
    "litellm>=1.90.0,<1.97.0;   python_version >= '3.10'",
    "fastapi>=0.110.0;  python_version >= '3.10'",
    "uvicorn>=0.27.0;   python_version >= '3.10'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "build",
    "twine",
    "httpx>=0.27.0",
    "pytest-asyncio==0.21.1",
]

[project.scripts]
sulci-mcp   = "sulci.integrations.mcp_server:main"
sulci-proxy = "sulci.proxy.__main__:main"

[project.urls]
Homepage      = "https://sulci.io"
Repository    = "https://github.com/sulci-io/sulci-oss"
Documentation = "https://github.com/sulci-io/sulci-oss#readme"
Changelog     = "https://github.com/sulci-io/sulci-oss/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/sulci-io/sulci-oss/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["sulci*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
